<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04081a" />
    <meta
      name="description"
      content="YASLOGIST Ocean is an interactive sea-freight capability demo built for connected corridors across Egypt, Saudi Arabia, the Red Sea and the Gulf. The current simulated gateway scenario uses five Egyptian ports; no live customer operations."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://ocean.yaslogist.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ocean.yaslogist.me/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="YASLOGIST Ocean — Interactive Sea-Freight Intelligence Demo" />
    <meta name="twitter:description" content="Interactive capability demo using simulated ocean-freight scenarios. No live customer operations." />
    <title>YASLOGIST Ocean — Interactive Sea-Freight Intelligence Demo</title>
    <script>
      try {
        var t = localStorage.getItem("oq-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        /* Language changes the copy only. The document direction stays LTR in
           every language so the page geometry never mirrors for Arabic. */
        var l = localStorage.getItem("oq-lang");
        document.documentElement.dir = "ltr";
        if (l === "ar" || l === "zh" || l === "tr" || l === "fr" || l === "en") {
          document.documentElement.lang = l;
        }
      } catch (e) {}
    </script>
    <!-- The corporate hub's type stack, identical to main/index.html and
         land/index.html. Archivo = display (variable width axis), IBM Plex Sans
         = body, IBM Plex Mono = telemetry, IBM Plex Sans Arabic = Arabic UI,
         Aref Ruqaa = Arabic display and the Cairo clock label.
         display=swap keeps text painted immediately.
         The stack is self-hosted under /fonts: the page no longer makes a
         third-party font request, and no external origin can inject the
         stylesheet that decides how the interface is typeset. -->
    <link rel="stylesheet" href="./fonts/fonts.css" />

    <!-- Structured data. Deliberately minimal: it states what the page is, not
         operational claims the demo does not make. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "YASLOGIST",
            "url": "https://yaslogist.me"
          },
          {
            "@type": "WebApplication",
            "name": "YASLOGIST Ocean",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Interactive sea-freight capability demo built for connected corridors across Egypt, Saudi Arabia, the Red Sea and the Gulf. The current simulated gateway scenario uses five Egyptian ports; no live customer operations.",
            "isPartOf": { "@type": "Organization", "name": "YASLOGIST" }
          }
        ]
      }
    </script>
    <!-- Current YASLOGIST monogram: YL inside a single outer circle. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%2322e4ff'%3E%3Ccircle cx='32' cy='32' r='29' stroke-width='2.2'/%3E%3Cg stroke-width='5' stroke-linecap='square'%3E%3Cpath d='M16 16 L27.5 31.5 L27.5 49'/%3E%3Cpath d='M39 16 L30 28'/%3E%3Cpath d='M40.5 20 L40.5 48 L53 48'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>

      >
        <p style="font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: #0b6b8a; margin: 0 0 .75rem">
          YASLOGIST Ocean &middot; Demo
        </p>
        <h1 style="font-size: 1.6rem; margin: 0 0 1rem; line-height: 1.2">
          Sea-freight intelligence across Egypt, Saudi Arabia and connected corridors
        </h1>
        <p style="margin: 0 0 1rem">
          This page is an interactive capability demo: it renders its interface with JavaScript, so the
          animated fleet view, the berth console and the voyage simulator need scripting enabled. With
          JavaScript turned off you are seeing this fallback instead of an empty document.
        </p>
        <p style="margin: 0 0 1.5rem">
          The scenario shown here is simulated and uses five Egyptian gateways. It is not a live operations
          dashboard and no customer shipment data is involved.

</html>
