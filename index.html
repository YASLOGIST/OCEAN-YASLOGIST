<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04081a" />
    <meta
      name="description"
      content="YASLOGIST Ocean — real-time container and vessel visibility across the Egyptian sea gateways (Alexandria, El Dekheila, Sokhna, Damietta, East Port Said), with predictive ETAs, port congestion radar and B/L-to-truck-plate reference stitching. Corporate branch: New Cairo, Cairo, Egypt."
    />
    <title>YASLOGIST — The Next-Gen Supply Chain Intelligence Platform</title>
    <script>
      try {
        var t = localStorage.getItem("oq-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("oq-lang");
        if (l === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        } else if (l === "zh" || l === "tr" || l === "fr" || l === "en") {
          document.documentElement.lang = l;
          document.documentElement.dir = "ltr";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The corporate hub's type stack, identical to main/index.html and
         land/index.html. Archivo = display (variable width axis), IBM Plex Sans
         = body, IBM Plex Mono = telemetry, IBM Plex Sans Arabic = Arabic UI,
         Aref Ruqaa = Arabic display and the Cairo clock label.
         display=swap keeps text painted immediately. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Aref+Ruqaa:wght@400;700&family=Aref+Ruqaa+Ink:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Canonical YASLOGIST monogram, the same mark as main/media/logo.svg and
         land/index.html. The previous icon was a bespoke mast-and-swell glyph
         that matched neither this site's own header nor the other surfaces. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%2322e4ff'%3E%3Cg stroke-width='1.6' opacity='.55'%3E%3Cellipse cx='32' cy='32' rx='12.5' ry='29'/%3E%3Cpath d='M3 32h58M8 17.5h48M8 46.5h48'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='29' stroke-width='2.2'/%3E%3Cg stroke-width='5' stroke-linecap='square'%3E%3Cpath d='M16 16 L27.5 31.5 L27.5 49'/%3E%3Cpath d='M39 16 L30 28'/%3E%3Cpath d='M40.5 20 L40.5 48 L53 48'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
